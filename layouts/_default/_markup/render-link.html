{{ if (strings.HasPrefix .Destination "mailto") -}}
  {{ with .Text -}}
    {{ partial "main/email" (dict "emailAddress" $.Destination "emailTitle" .) }}
  {{ else -}}
    {{ partial "main/email" (dict "emailAddress" $.Destination) }}
  {{ end -}}
{{ else -}}
  <a href="{{ .Destination | safeURL }}"{{ if in (slice "https://webrtc-observer.org/" "https://dashboard.webrtc-observer.org/") .Destination }} target="_blank" rel="noopener noreferrer"{{ end }}{{ with .Title}} title="{{ . }}"{{ end }}>{{ .Text | safeHTML }}</a>
{{- end -}}
