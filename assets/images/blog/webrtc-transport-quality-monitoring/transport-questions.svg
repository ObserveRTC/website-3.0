<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 350" role="img" aria-labelledby="tq-map-title" style="font-family:Jost,system-ui,sans-serif;width:100%;height:auto;display:block"><title id="tq-map-title">Four concurrent transport quality questions</title><rect width="840" height="350" rx="12" fill="var(--rtc-surface, #f6f8fa)"/><path d="M37 27 Q130 24 223 27 L224 87 Q130 90 36 87 Z" fill="var(--bs-body-bg, #fff)" stroke="var(--rtc-accent, #bc4319)" stroke-width="2" stroke-linejoin="round"/><text x="130" y="65" text-anchor="middle" font-size="24" fill="var(--rtc-accent, #bc4319)">Bandwidth</text><text x="260" y="65" font-size="24" fill="var(--bs-body-color, #28323b)">Is there enough bandwidth?</text><path d="M37 107 Q130 104 223 107 L224 167 Q130 170 36 167 Z" fill="var(--bs-body-bg, #fff)" stroke="var(--rtc-accent, #bc4319)" stroke-width="2" stroke-linejoin="round"/><text x="130" y="145" text-anchor="middle" font-size="24" fill="var(--rtc-accent, #bc4319)">Delay</text><text x="260" y="145" font-size="24" fill="var(--bs-body-color, #28323b)">How high is the round-trip time?</text><path d="M37 187 Q130 184 223 187 L224 247 Q130 250 36 247 Z" fill="var(--bs-body-bg, #fff)" stroke="var(--rtc-accent, #bc4319)" stroke-width="2" stroke-linejoin="round"/><text x="130" y="225" text-anchor="middle" font-size="24" fill="var(--rtc-accent, #bc4319)">Delivery</text><text x="260" y="225" font-size="24" fill="var(--bs-body-color, #28323b)">What went missing?</text><path d="M37 267 Q130 264 223 267 L224 327 Q130 330 36 327 Z" fill="var(--bs-body-bg, #fff)" stroke="var(--rtc-accent, #bc4319)" stroke-width="2" stroke-linejoin="round"/><text x="130" y="305" text-anchor="middle" font-size="24" fill="var(--rtc-accent, #bc4319)">Stability</text><text x="260" y="305" font-size="24" fill="var(--bs-body-color, #28323b)">Does it arrive evenly?</text></svg>