-accent, #bc4319)" stroke-width="2" stroke-linecap="round"/><path d="M28 264 Q420 261 813 264 L812 314 Q420 316 26 313 Z" fill="var(--bs-body-bg, #fff)" stroke="var(--rtc-accent, #bc4319)" stroke-width="2" stroke-linejoin="round"/><text x="42" y="295" font-size="21" fill="var(--rtc-accent, #bc4319)">Establishment</text><text x="235" y="294" font-size="18" fill="var(--bs-body-color, #28323b)">Successful pairs, nomination, selected pair</text><path d="M112 316 Q111 322 112 328 m-4 -4 4 4 4 -4" fill="none" stroke="var(--rtc-accent, #bc4319)" stroke-width="2" stroke-linecap="round"/><path d="M28 332 Q420 329 813 332 L812 382 Q420 384 26 381 Z" fill="var(--bs-body-bg, #fff)" stroke="var(--rtc-accent, #bc4319)" stroke-width="2" stroke-linejoin="round"/><text x="42" y="363" font-size="21" fill="var(--rtc-accent, #bc4319)">Transport</text><text x="235" y="362" font-size="18" fill="var(--bs-body-color, #28323b)">Secure transport reaches connected</text><path d="M112 384 Q111 390 112 396 m-4 -4 4 4 4 -4" fill="none" stroke="var(--rtc-accent, #bc4319)" stroke-width="2" stroke-linecap="round"/><path d="M28 400 Q420 397 813 400 L812 450 Q420 452 26 449 Z" fill="var(--bs-body-bg, #fff)" stroke="var(--rtc-accent, #bc4319)" stroke-width="2" stroke-linejoin="round"/><text x="42" y="431" font-size="21" fill="var(--rtc-accent, #bc4319)">Continuity</text><text x="235" y="430" font-size="18" fill="var(--bs-body-color, #28323b)">State, traffic, selected path, restart outcomes</text><text x="26" y="490" font-size="18" fill="var(--bs-body-color, #28323b)">Signaling needs application logs. Check media progress separately.</text></svg>