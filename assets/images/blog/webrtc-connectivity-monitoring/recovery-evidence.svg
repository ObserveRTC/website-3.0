<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 490" role="img" aria-label="Hypothetical recovery observations" style="font-family:Jost,system-ui,sans-serif;width:100%;height:auto;display:block"><title>Hypothetical recovery observations</title><rect width="840" height="490" rx="12" fill="var(--rtc-surface, #f6f8fa)"/><g fill="var(--bs-body-color, #28323b)" font-size="19"><text x="26" y="36" font-size="24" fill="var(--rtc-accent, #bc4319)">One interruption, several observations</text><text x="26" y="66" font-size="17">Illustrative stats time; defaults shown</text><path d="M120 91 Q466.0 88 814 92 L813 154 Q466.0 156 118 153 Z" fill="var(--bs-body-bg, #fff)" stroke="var(--rtc-accent, #bc4319)" stroke-width="2" stroke-linejoin="round"/><text x="26" y="118" font-size="19" fill="var(--rtc-accent, #bc4319)">0 s</text><text x="135" y="117" font-size="21" fill="var(--rtc-accent, #bc4319)">Incoming bytes stop</text><text x="135" y="140" font-size="17">ICE still connected; outgoing bytes increase</text><path d="M120 166 Q466.0 163 814 167 L813 229 Q466.0 231 118 228 Z" fill="var(--bs-body-bg, #fff)" stroke="var(--rtc-accent, #bc4319)" stroke-width="2" stroke-linejoin="round"/><text x="26" y="193" font-size="19" fill="var(--rtc-accent, #bc4319)">5 s</text><text x="135" y="192" font-size="21" fill="var(--rtc-accent, #bc4319)">Stall finding opens</text><text x="135" y="215" font-size="17">The guarded asymmetry persisted</text><path d="M120 241 Q466.0 238 814 242 L813 304 Q466.0 306 118 303 Z" fill="var(--bs-body-bg, #fff)" stroke="var(--rtc-accent, #bc4319)" stroke-width="2" stroke-linejoin="round"/><text x="26" y="268" font-size="19" fill="var(--rtc-accent, #bc4319)">10 s</text><text x="135" y="267" font-size="21" fill="var(--rtc-accent, #bc4319)">Restart recommended</text><text x="135" y="290" font-size="17">Application decides whether to act</text><path d="M120 316 Q466.0 313 814 317 L813 379 Q466.0 381 118 378 Z" fill="var(--bs-body-bg, #fff)" stroke="var(--rtc-accent, #bc4319)" stroke-width="2" stroke-linejoin="round"/><text x="26" y="343" font-size="19" fill="var(--rtc-accent, #bc4319)">Later</text><text x="135" y="342" font-size="21" fill="var(--rtc-accent, #bc4319)">Restart detected, then ICE recovered</text><text x="135" y="365" font-size="17">Fragment change and ICE outcome observed</text><path d="M120 391 Q466.0 388 814 392 L813 454 Q466.0 456 118 453 Z" fill="var(--bs-body-bg, #fff)" stroke="var(--rtc-accent, #bc4319)" stroke-width="2" stroke-linejoin="round"/><text x="26" y="418" font-size="19" fill="var(--rtc-accent, #bc4319)">Later still</text><text x="135" y="417" font-size="21" fill="var(--rtc-accent, #bc4319)">Media resumes</text><text x="135" y="440" font-size="17">Measure traffic and decoding independently</text></g></svg>