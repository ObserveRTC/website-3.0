<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" role="img" aria-label="Sending and receiving media pipelines" style="font-family:Jost,system-ui,sans-serif;width:100%;height:auto;display:block"><title>Sending and receiving media pipelines</title><defs><marker id="pipeline-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 Q5 4 9 5 Q5 6 1 9" fill="none" stroke="var(--rtc-accent, #bc4319)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></marker><filter id="media-boundaries-pencil" x="-5%" y="-10%" width="110%" height="120%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency=".025 .07" numOctaves="2" seed="7" result="grain" /><feDisplacementMap in="SourceGraphic" in2="grain" scale="2.8" xChannelSelector="R" yChannelSelector="G" /></filter></defs><rect width="840" height="480" rx="12" fill="var(--rtc-surface, #f6f8fa)" /><g fill="var(--bs-body-color, #28323b)" stroke-linecap="round" stroke-linejoin="round"><text x="20" y="35" font-size="24" font-weight="500" font-family="Jost, system-ui, sans-serif" letter-spacing=".15" fill="var(--rtc-accent, #bc4319)">Sending</text><path d="M22 55 Q132.5 53 245 56 L244 136 Q132.5 138 20 135 Z" fill="var(--bs-body-bg, #fff)" stroke="var(--rtc-accent, #bc4319)" stroke-width="2" filter="url(#media-boundaries-pencil)" /><path d="M25 53 Q132.5 56 240 54" fill="none" stroke="var(--rtc-accent, #bc4319)" opacity=".3" filter="url(#media-boundaries-pencil)" /><text x="33" y="86" font-size="21" font-weight="500" font-family="Jost, system-ui, sans-serif" letter-spacing=".15" fill="var(--rtc-accent, #bc4319)">Capture</text><text x="33" y="116" font-size="16" font-weight="400" font-family="Jost, system-ui, sans-serif" letter-spacing=".15">Fresh source frames</text><path d="M307 55 Q417.5 53 530 56 L529 136 Q417.5 138 305 135 Z" fill="var(--bs-body-bg, #fff)" stroke="var(--rtc-accent, #bc4319)" stroke-width="2" filter="url(#media-boundaries-pencil)" /><path d="M310 53 Q417.5 56 525 54" fill="none" stroke="var(--rtc-accent, #bc4319)" opacity=".3" filter="url(#media-boundaries-pencil)" /><text x="318" y="86" font-size="21" font-weight="500" font-family="Jost, system-ui, sans-serif" letter-spacing=".15" fill="var(--rtc-accent, #bc4319)">Encode</text><text x="318" y="116" font-size="16" font-weight="400" font-family="Jost, system-ui, sans-serif" letter-spacing=".15">Encoded output</text><path d="M592 55 Q702.5 53 815 56 L814 136 Q702.5 138 590 135 Z" fill="var(--bs-body-bg, #fff)" stroke="var(--rtc-accent, #bc4319)" stroke-width="2" filter="url(#media-boundaries-pencil)" /><path d="M595 53 Q702.5 56 810 54" fill="none" stroke="var(--rtc-accent, #bc4319)" opacity=".3" filter="url(#media-boundaries-pencil)" /><text x="603" y="86" font-size="21" font-weight="500" font-family="Jost, system-ui, sans-serif" letter-spacing=".15" fill="var(--rtc-accent, #bc4319)">Transmit</text><text x="603" y="116" font-size="16" font-weight="400" font-family="Jost, system-ui, sans-serif" letter-spacing=".15">RTP packets sent</text><path d="M252 96Q273.5 95 295 96" stroke="var(--rtc-accent, #bc4319)" stroke-width="2" fill="none" marker-end="url(#pipeline-arrow)" filter="url(#media-boundaries-pencil)" /><path d="M537 96Q558.5 95 580 96" stroke="var(--rtc-accent, #bc4319)" stroke-width="2" fill="none" marker-end="url(#pipeline-arrow)" filter="url(#media-boundaries-pencil)" /><text x="20" y="184" font-size="19" font-weight="400" font-family="Jost, system-ui, sans-serif" letter-spacing=".15">Network delivery / optional SFU</text><path d="M20 199Q420 196 815 199" stroke="var(--rtc-accent, #bc4319)" stroke-dasharray="5 6" fill="none" filter="url(#media-boundaries-pencil)" /><text x="20" y="229" font-size="17" font-weight="400" font-family="Jost, system-ui, sans-serif" letter-spacing=".15">Relate what was sent to what arrived at the receiver.</text><text x="20" y="285" font-size="24" font-weight="500" font-family="Jost, system-ui, sans-serif" letter-spacing=".15" fill="var(--rtc-accent, #bc4319)">Receiving</text><path d="M22 305 Q110.0 303 200 306 L199 386 Q110.0 388 20 385 Z" fill="var(--bs-body-bg, #fff)" stroke="var(--rtc-accent, #bc4319)" stroke-width="2" filter="url(#media-boundaries-pencil)" /><path d="M25 303 Q110.0 306 195 304" fill="none" stroke="var(--rtc-accent, #bc4319)" opacity=".3" filter="url(#media-boundaries-pencil)" /><text x="33" y="336" font-size="21" font-weight="500" font-family="Jost, system-ui, sans-serif" letter-spacing=".15" fill="var(--rtc-accent, #bc4319)">Receive</text><text x="33" y="366" font-size="16" font-weight="400" font-family="Jost, system-ui, sans-serif" letter-spacing=".15">RTP packets arrive</text><path d="M227 305 Q315.0 303 405 306 L404 386 Q315.0 388 225 385 Z" fill="var(--bs-body-bg, #fff)" stroke="var(--rtc-accent, #bc4319)" stroke-width="2" filter="url(#media-boundaries-pencil)" /><path d="M230 303 Q315.0 306 400 304" fill="none" stroke="var(--rtc-accent, #bc4319)" opacity=".3" filter="url(#media-boundaries-pencil)" /><text x="238" y="336" font-size="21" font-weight="500" font-family="Jost, system-ui, sans-serif" letter-spacing=".15" fill="var(--rtc-accent, #bc4319)">Assemble</text><text x="238" y="366" font-size="16" font-weight="400" font-family="Jost, system-ui, sans-serif" letter-spacing=".15">Complete frames</text><path d="M432 305 Q520.0 303 610 306 L609 386 Q520.0 388 430 385 Z" fill="var(--bs-body-bg, #fff)" stroke="var(--rtc-accent, #bc4319)" stroke-width="2" filter="url(#media-boundaries-pencil)" /><path d="M435 303 Q520.0 306 605 304" fill="none" stroke="var(--rtc-accent, #bc4319)" opacity=".3" filter="url(#media-boundaries-pencil)" /><text x="443" y="336" font-size="21" font-weight="500" font-family="Jost, system-ui, sans-serif" letter-spacing=".15" fill="var(--rtc-accent, #bc4319)">Decode</text><text x="443" y="366" font-size="16" font-weight="400" font-family="Jost, system-ui, sans-serif" letter-spacing=".15">Decoded output</text><path d="M637 305 Q725.0 303 815 306 L814 386 Q725.0 388 635 385 Z" fill="var(--bs-body-bg, #fff)" stroke="var(--rtc-accent, #bc4319)" stroke-width="2" filter="url(#media-boundaries-pencil)" /><path d="M640 303 Q725.0 306 810 304" fill="none" stroke="var(--rtc-accent, #bc4319)" opacity=".3" filter="url(#media-boundaries-pencil)" /><text x="648" y="336" font-size="21" font-weight="500" font-family="Jost, system-ui, sans-serif" letter-spacing=".15" fill="var(--rtc-accent, #bc4319)">Present</text><text x="648" y="366" font-size="16" font-weight="400" font-family="Jost, system-ui, sans-serif" letter-spacing=".15">Fresh displayed frames</text><path d="M205 346Q212.5 345 220 346" stroke="var(--rtc-accent, #bc4319)" stroke-width="2" fill="none" marker-end="url(#pipeline-arrow)" filter="url(#media-boundaries-pencil)" /><path d="M410 346Q417.5 345 425 346" stroke="var(--rtc-accent, #bc4319)" stroke-width="2" fill="none" marker-end="url(#pipeline-arrow)" filter="url(#media-boundaries-pencil)" /><path d="M615 346Q622.5 345 630 346" stroke="var(--rtc-accent, #bc4319)" stroke-width="2" fill="none" marker-end="url(#pipeline-arrow)" filter="url(#media-boundaries-pencil)" /><text x="20" y="435" font-size="18" font-weight="400" font-family="Jost, system-ui, sans-serif" letter-spacing=".15">Compare progress within each pipeline; check expected activity and available inputs.</text></g></svg>