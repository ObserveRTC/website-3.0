<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 350" role="img" aria-label="Equal average frame rates can hide a ten-second interruption" style="font-family: Jost, system-ui, sans-serif; width:100%; height:auto; display:block;"><title id="averages-hide-gaps-title">Equal average frame rates can hide a ten-second interruption</title><defs><marker id="averages-hide-gaps-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 Q5 4 9 5 Q5 6 1 9" fill="none" stroke="var(--rtc-accent, #bc4319)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></marker><filter id="averages-hide-gaps-pencil" x="-5%" y="-10%" width="110%" height="120%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency=".025 .07" numOctaves="2" seed="7" result="grain" /><feDisplacementMap in="SourceGraphic" in2="grain" scale="2.8" xChannelSelector="R" yChannelSelector="G" /></filter></defs><rect width="840" height="350" rx="12" fill="var(--rtc-surface, #f6f8fa)" /><g font-family="inherit" fill="var(--bs-body-color, #28323b)" stroke-linecap="round" stroke-linejoin="round"><text x="25" y="36" font-size="25" font-weight="500" font-family="Jost, system-ui, sans-serif" letter-spacing=".15" fill="var(--rtc-accent, #bc4319)">Same average, different continuity</text><text x="25" y="95" font-size="22" font-weight="500" font-family="Jost, system-ui, sans-serif" letter-spacing=".15" fill="var(--rtc-accent, #bc4319)">A</text><path d="M80 125H790" stroke="var(--rtc-line, #e1e5eb)" filter="url(#averages-hide-gaps-pencil)" /><text x="25" y="205" font-size="22" font-weight="500" font-family="Jost, system-ui, sans-serif" letter-spacing=".15" fill="var(--rtc-accent, #bc4319)">B</text><path d="M80 235H790" stroke="var(--rtc-line, #e1e5eb)" filter="url(#averages-hide-gaps-pencil)" /><path d="M80 95H790 M80 195H670V235H790" stroke="var(--rtc-accent, #bc4319)" stroke-width="4" fill="none" filter="url(#averages-hide-gaps-pencil)" /><text x="85" y="80" font-size="18" font-weight="400" font-family="Jost, system-ui, sans-serif" letter-spacing=".15">25 frames/s</text><text x="85" y="180" font-size="18" font-weight="400" font-family="Jost, system-ui, sans-serif" letter-spacing=".15">30 frames/s</text><text x="676" y="270" font-size="17" font-weight="400" font-family="Jost, system-ui, sans-serif" letter-spacing=".15">10 s gap</text><text x="80" y="315" font-size="21" font-weight="500" font-family="Jost, system-ui, sans-serif" letter-spacing=".15" fill="var(--rtc-accent, #bc4319)">Both: 1,500 decoded frames over 60 seconds = 25 fps</text></g></svg>