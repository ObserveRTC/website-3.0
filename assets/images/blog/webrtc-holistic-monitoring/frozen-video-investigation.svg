><text x="648" y="151" font-size="14">framesRendered</text><text x="648" y="191" font-size="19" fill="var(--rtc-accent,#bc4319)">Flat</text><path d="M414 224 Q520 230 618 224" fill="none" stroke="var(--rtc-accent,#bc4319)" stroke-width="2"/>
