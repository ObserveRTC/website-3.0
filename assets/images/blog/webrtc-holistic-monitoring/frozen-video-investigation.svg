<rect width="840" height="350" rx="12" fill="var(--rtc-surface,#f6f8fa)"/>
<g fill="var(--bs-body-color,#28323b)" stroke-linecap="round" stroke-linejoin="round">
<text x="24" y="36" font-size="23" font-weight="500">Where did video progress stop?</text>
<text x="24" y="65" font-size="16">Same incoming video stream · same measurement interval · playback expected</text>
