<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 350" role="img" aria-labelledby="freeze-title freeze-desc" style="font-family:Jost,system-ui,sans-serif;width:100%;height:auto;display:block">
<title id="freeze-title">Where did video progress stop?</title><desc id="freeze-desc">Illustrative measurements over the same interval: packet and complete-frame counters increase; decoded and rendered frame counters stay flat. Investigate decoder input and decoding; the cause remains unknown.</desc>
