<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" role="img" aria-labelledby="issue-lifecycle-title" style="font-family:Jost,system-ui,sans-serif;width:100%;height:auto;display:block"><title id="issue-lifecycle-title">Stateful issue lifecycle: observations, confirmation, raise, evidence updates, recovery, resolution</title><defs><marker id="issue-lifecycle-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="var(--rtc-accent, #bc4319)" stroke-width="1.6"/></marker></defs><rect width="1000" height="350" rx="12" fill="var(--rtc-surface, #f6f8fa)"/><path d="M300 87 L350 87" fill="none" stroke="var(--rtc-accent, #bc4319)" stroke-width="2" stroke-linecap="round" marker-end="url(#issue-lifecycle-arrow)"/><path d="M640 87 L690 87" fill="none" stroke="var(--rtc-accent, #bc4319)" stroke-width="2" stroke-linecap="round" marker-end="url(#issue-lifecycle-arrow)"/><path d="M835 127 L835 215" fill="none" stroke="var(--rtc-accent, #bc4319)" stroke-width="2" stroke-linecap="round" marker-end="url(#issue-lifecycle-arrow)"/><path d="M690 255 L640 255" fill="none" stroke="var(--rtc-accent, #bc4319)" stroke-width="2" stroke-linecap="round" marker-end="url(#issue-lifecycle-arrow)"/><path d="M350 255 L300 255" fill="none" stroke="var(--rtc-accent, #bc4319)" stroke-width="2" stroke-linecap="round" marker-end="url(#issue-lifecycle-arrow)"/><path d="M22 48 Q160.0 45 298 48 L299 126 Q160.0 129 21 126 Z" fill="var(--bs-body-bg, #fff)" stroke="var(--rtc-accent, #bc4319)" stroke-width="2" stroke-linejoin="round"/><text x="160.0" y="79" text-anchor="middle" font-size="24" fill="var(--rtc-accent, #bc4319)">Eligible observations</text><text x="160.0" y="107" text-anchor="middle" font-size="19" fill="var(--bs-body-color, #28323b)">Measurements and state</text><path d="M352 48 Q495.0 45 638 48 L639 126 Q495.0 129 351 126 Z" fill="var(--bs-body-bg, #fff)" stroke="var(--rtc-accent, #bc4319)" stroke-width="2" stroke-linejoin="round"/><text x="495.0" y="79" text-anchor="middle" font-size="24" fill="var(--rtc-accent, #bc4319)">Condition confirmed</text><text x="495.0" y="107" text-anchor="middle" font-size="19" fill="var(--bs-body-color, #28323b)">Detector criteria met</text><path d="M692 48 Q835.0 45 978 48 L979 126 Q835.0 129 691 126 Z" fill="var(--bs-body-bg, #fff)" stroke="var(--rtc-accent, #bc4319)" stroke-width="2" stroke-linejoin="round"/><text x="835.0" y="79" text-anchor="middle" font-size="24" fill="var(--rtc-accent, #bc4319)">Keyed issue raised</text><text x="835.0" y="107" text-anchor="middle" font-size="19" fill="var(--bs-body-color, #28323b)">An active occurrence begins</text><path d="M692 216 Q835.0 213 978 216 L979 294 Q835.0 297 691 294 Z" fill="var(--bs-body-bg, #fff)" stroke="var(--rtc-accent, #bc4319)" stroke-width="2" stroke-linejoin="round"/><text x="835.0" y="247" text-anchor="middle" font-size="24" fill="var(--rtc-accent, #bc4319)">Evidence updated</text><text x="835.0" y="275" text-anchor="middle" font-size="19" fill="var(--bs-body-color, #28323b)">The issue remains active</text><path d="M352 216 Q495.0 213 638 216 L639 294 Q495.0 297 351 294 Z" fill="var(--bs-body-bg, #fff)" stroke="var(--rtc-accent, #bc4319)" stroke-width="2" stroke-linejoin="round"/><text x="495.0" y="247" text-anchor="middle" font-size="24" fill="var(--rtc-accent, #bc4319)">Recovery confirmed</text><text x="495.0" y="275" text-anchor="middle" font-size="19" fill="var(--bs-body-color, #28323b)">Recovery criteria met</text><path d="M22 216 Q160.0 213 298 216 L299 294 Q160.0 297 21 294 Z" fill="var(--bs-body-bg, #fff)" stroke="var(--rtc-accent, #bc4319)" stroke-width="2" stroke-linejoin="round"/><text x="160.0" y="247" text-anchor="middle" font-size="24" fill="var(--rtc-accent, #bc4319)">Issue resolved</text><text x="160.0" y="275" text-anchor="middle" font-size="19" fill="var(--bs-body-color, #28323b)">The active occurrence ends</text><text x="500" y="332" text-anchor="middle" font-size="19" fill="var(--bs-body-color, #28323b)">The same issue key links an occurrence from raise to resolution.</text></svg>